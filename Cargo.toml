[package]
name = "ff-export"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Fossil Fighters (NDS) -> glTF/GLB asset exporter"
publish = false

[dependencies]
# Stage 1 (current): crates, to reach a confirmed-working .glb quickly.
# Stage 2: replace with dependency-free implementations once the output is verified.
anyhow = "1"
gltf = "1"
png = "0.17"
# The catalog is data, so it is serialised rather than formatted by hand, and the tests read the
# reference JSON with the same crate. Both are already in the tree behind `gltf`.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3

